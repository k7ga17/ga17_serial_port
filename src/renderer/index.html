<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
        />
        <title>Serial Monitor</title>
        <link rel="stylesheet" href="styles/main.css" />
    </head>
    <body>
        <div id="app">
            <!-- 顶部标题栏 -->
            <header id="titleBar">
                <div id="titleMenu">
                    <span class="titleText">Serial Monitor</span>
                </div>
                <div id="windowControls">
                    <div id="layoutButtons">
                        <button id="toggleSidebarBtn" class="layoutBtn" title="切换主侧栏 (Ctrl+B)">
                            <svg class="icon-closed" viewBox="0 0 16 16" width="16" height="16">
                                <path d="M1 3.5V12.5C1 13.879 2.122 15 3.5 15H12.5C13.878 15 15 13.879 15 12.5V3.5C15 2.122 13.878 1 12.5 1H3.5C2.122 1 1 2.122 1 3.5ZM12.5 14H7V2H12.5C13.327 2 14 2.673 14 3.5V12.5C14 13.327 13.327 14 12.5 14ZM2 3.5C2 2.673 2.673 2 3.5 2H6V14H3.5C2.673 14 2 13.327 2 12.5V3.5Z"/>
                            </svg>
                            <svg class="icon-open" viewBox="0 0 16 16" width="16" height="16">
                                <path d="M12.5 1C13.881 1 15 2.119 15 3.5V12.5C15 13.881 13.881 15 12.5 15H3.5C2.119 15 1 13.881 1 12.5V3.5C1 2.119 2.119 1 3.5 1H12.5ZM12.5 14C13.328 14 14 13.328 14 12.5V3.5C14 2.672 13.328 2 12.5 2H7V14H12.5Z"/>
                            </svg>
                        </button>
                        <button id="togglePanelBtn" class="layoutBtn" title="切换面板 (Ctrl+J)">
                            <svg class="icon-closed" viewBox="0 0 16 16" width="16" height="16">
                                <path d="M12.5 1H3.5C2.122 1 1 2.121 1 3.5V12.5C1 13.879 2.122 15 3.5 15H12.5C13.878 15 15 13.879 15 12.5V3.5C15 2.121 13.878 1 12.5 1ZM14 12.5C14 13.327 13.327 14 12.5 14H3.5C2.673 14 2 13.327 2 12.5V11H14V12.5ZM14 10H2V3.5C2 2.673 2.673 2 3.5 2H12.5C13.327 2 14 2.673 14 3.5V10Z"/>
                            </svg>
                            <svg class="icon-open" viewBox="0 0 16 16" width="16" height="16">
                                <path d="M15 12.5C15 13.881 13.881 15 12.5 15H3.5C2.119 15 1 13.881 1 12.5V3.5C1 2.119 2.119 1 3.5 1H12.5C13.881 1 15 2.119 15 3.5V12.5ZM2 10H14V3.5C14 2.672 13.328 2 12.5 2H3.5C2.672 2 2 2.672 2 3.5V10Z"/>
                            </svg>
                        </button>
                        <button id="toggleAuxBarBtn" class="layoutBtn" title="切换辅助侧栏 (Ctrl+Alt+B)">
                            <svg class="icon-closed" viewBox="0 0 16 16" width="16" height="16">
                                <path d="M12.5 1H3.5C2.122 1 1 2.122 1 3.5V12.5C1 13.879 2.122 15 3.5 15H12.5C13.878 15 15 13.879 15 12.5V3.5C15 2.122 13.878 1 12.5 1ZM2 12.5V3.5C2 2.673 2.673 2 3.5 2H9V14H3.5C2.673 14 2 13.327 2 12.5ZM14 12.5C14 13.327 13.327 14 12.5 14H10V2H12.5C13.327 2 14 2.673 14 3.5V12.5Z"/>
                            </svg>
                            <svg class="icon-open" viewBox="0 0 16 16" width="16" height="16">
                                <path d="M12.5 1C13.881 1 15 2.119 15 3.5V12.5C15 13.881 13.881 15 12.5 15H3.5C2.119 15 1 13.881 1 12.5V3.5C1 2.119 2.119 1 3.5 1H12.5ZM9 14V2H3.5C2.672 2 2 2.672 2 3.5V12.5C2 13.328 2.672 14 3.5 14H9Z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="divider"></div>
                    <button id="minimizeBtn" class="iconBtn" title="最小化">
                        <svg viewBox="0 0 12 12" width="12" height="12">
                            <rect x="1" y="5.5" width="10" height="1" fill="currentColor"/>
                        </svg>
                    </button>
                    <button id="maximizeBtn" class="iconBtn" title="最大化">
                        <svg id="maximizeIcon" viewBox="0 0 12 12" width="12" height="12">
                            <rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/>
                        </svg>
                        <svg id="restoreIcon" class="hidden" viewBox="0 0 12 12" width="12" height="12">
                            <rect x="2.5" y="3.5" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1"/>
                            <path d="M3.5 3.5 V1.5 H10.5 V8.5 H8.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button id="closeBtn" class="iconBtn closeBtn" title="关闭">
                        <svg viewBox="0 0 12 12" width="12" height="12">
                            <path d="M1.5 1.5 L10.5 10.5 M10.5 1.5 L1.5 10.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- 中间区域 -->
            <div id="centerArea">
                <!-- 左侧功能栏 -->
                <nav id="activityBar">
                    <div class="activity-icon" data-view="explorer" title="资源管理器">
                        <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                            <path d="M7.5 22.5H17.595C17.07 23.4 16.11 24 15 24H7.5C4.185 24 1.5 21.315 1.5 18V6C1.5 4.89 2.1 3.93 3 3.405V18C3 20.475 5.025 22.5 7.5 22.5ZM21 8.121V18C21 19.6545 19.6545 21 18 21H7.5C5.8455 21 4.5 19.6545 4.5 18V3C4.5 1.3455 5.8455 0 7.5 0H12.879C13.4715 0 14.0505 0.24 14.4705 0.6585L20.3415 6.5295C20.766 6.954 21 7.5195 21 8.121ZM13.5 6.75C13.5 7.164 13.8375 7.5 14.25 7.5H19.1895L13.5 1.8105V6.75ZM19.5 18V9H14.25C13.0095 9 12 7.9905 12 6.75V1.5H7.5C6.672 1.5 6 2.1735 6 3V18C6 18.8265 6.672 19.5 7.5 19.5H18C18.828 19.5 19.5 18.8265 19.5 18Z"/>
                        </svg>
                    </div>
                    <div class="activity-icon" data-view="search" title="搜索">
                        <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                            <path d="M22.281 21.219L16.0875 15.0255C17.2815 13.5945 18 11.754 18 9.74854C18 5.19904 14.298 1.49854 9.75 1.49854C5.202 1.49854 1.5 5.20054 1.5 9.75004C1.5 14.2995 5.202 18 9.75 18C11.7555 18 13.5945 17.28 15.027 16.0875L21.2205 22.281C21.3675 22.428 21.5595 22.5 21.7515 22.5C21.9435 22.5 22.1355 22.4265 22.2825 22.281C22.575 21.9885 22.575 21.513 22.2825 21.2205L22.281 21.219ZM9.75 16.5C6.0285 16.5 3 13.4715 3 9.75004C3 6.02853 6.0285 3.00004 9.75 3.00004C13.4715 3.00004 16.5 6.02853 16.5 9.75004C16.5 13.4715 13.4715 16.5 9.75 16.5Z"/>
                        </svg>
                    </div>
                    <div class="activity-icon" data-view="serial" title="串口">
                        <img src="./assets/func_serial_port/icon_serial_port.svg" width="24" height="24">
                    </div>
                </nav>

                <!-- 右侧主显示区域 -->
                <div id="mainArea">
                    <!-- 工作区 -->
                    <div id="workspace">
                        <!-- 左侧边栏 -->
                        <aside id="sidebar" class="panel">
                            <!-- 资源管理器视图 -->
                            <div id="view-explorer" class="sidebar-view">
                                <div class="panel-header">Explorer</div>
                                <div class="panel-content">
                                    <div class="view-placeholder">文件浏览器</div>
                                </div>
                            </div>
                            <!-- 搜索视图 -->
                            <div id="view-search" class="sidebar-view">
                                <div class="panel-header">Search</div>
                                <div class="panel-content">
                                    <div class="view-placeholder">搜索内容</div>
                                </div>
                            </div>
                            <!-- 串口视图 -->
                            <div id="view-serial" class="sidebar-view">
                                <div class="panel-header">Serial Port</div>
                                <div class="panel-content serial-config">
                                    <!-- 串口号选择 -->
                                    <div class="config-section">
                                        <div class="config-row">
                                            <label class="config-label">Port</label>
                                            <select id="serial-port" class="config-select">
                                                <option value="">Select Port...</option>
                                            </select>
                                            <button id="refresh-ports-btn" class="config-btn" title="Refresh Ports">
                                                <svg viewBox="0 0 16 16" width="14" height="14">
                                                    <path fill="currentColor" d="M13.451 5.609l-.579-.939-1.068.812-.076.094c-.335.415-.927.5-1.367.181a1 1 0 0 1-.181-.181L8.694 3.19l-.939-.579-1.63 2.168 3.462 2.168 1.062-1.062c.537-.538.537-1.407 0-1.945-.537-.536-1.406-.536-1.943 0L6.171 6.276a.996.996 0 0 1 0 1.409l.76.76H1a1 1 0 0 1 0-2h5.931L4.707 4.221a.996.996 0 0 1 0-1.409l2.224-2.225a1.367 1.367 0 0 1 1.944 0c.536.537.536 1.405 0 1.942l-.968.968 3.453 2.168 1.63-2.168z"/>
                                                </svg>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- 连接按钮 -->
                                    <div class="config-section">
                                        <button id="connect-btn" class="connect-btn" disabled>
                                            <img id="connect-icon" src="./assets/func_serial_port/icon_port_connect.svg" width="14" height="14">
                                            <span id="connect-text">Connect</span>
                                        </button>
                                    </div>

                                    <!-- 波特率 -->
                                    <div class="config-section">
                                        <label class="config-label">Baud Rate</label>
                                        <select id="baud-rate-select" class="config-select">
                                            <option value="300">300</option>
                                            <option value="1200">1200</option>
                                            <option value="2400">2400</option>
                                            <option value="4800">4800</option>
                                            <option value="9600">9600</option>
                                            <option value="19200">19200</option>
                                            <option value="38400">38400</option>
                                            <option value="57600">57600</option>
                                            <option value="115200" selected>115200</option>
                                            <option value="230400">230400</option>
                                            <option value="460800">460800</option>
                                            <option value="921600">921600</option>
                                            <option value="2000000">2000000</option>
                                            <option value="3000000">3000000</option>
                                        </select>
                                    </div>

                                    <!-- 数据位 -->
                                    <div class="config-section">
                                        <label class="config-label">Data Bits</label>
                                        <select id="data-bits" class="config-select">
                                            <option value="5">5</option>
                                            <option value="6">6</option>
                                            <option value="7">7</option>
                                            <option value="8" selected>8</option>
                                        </select>
                                    </div>

                                    <!-- 停止位 -->
                                    <div class="config-section">
                                        <label class="config-label">Stop Bits</label>
                                        <select id="stop-bits" class="config-select">
                                            <option value="1" selected>1</option>
                                            <option value="1.5">1.5</option>
                                            <option value="2">2</option>
                                        </select>
                                    </div>

                                    <!-- 校验位 -->
                                    <div class="config-section">
                                        <label class="config-label">Parity</label>
                                        <select id="parity" class="config-select">
                                            <option value="none" selected>None</option>
                                            <option value="even">Even</option>
                                            <option value="odd">Odd</option>
                                            <option value="mark">Mark</option>
                                            <option value="space">Space</option>
                                        </select>
                                    </div>

                                    <!-- 流控制 -->
                                    <div class="config-section">
                                        <label class="config-label">Flow Control</label>
                                        <select id="flow-control" class="config-select">
                                            <option value="none" selected>None</option>
                                            <option value="hardware">Hardware</option>
                                            <option value="software">Software</option>
                                        </select>
                                    </div>

                                    <!-- 接收编码 -->
                                    <div class="config-section">
                                        <label class="config-label">Encoding</label>
                                        <select id="encoding-select" class="config-select">
                                            <option value="gbk" selected>GBK</option>
                                            <option value="utf8">UTF-8</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </aside>
                        <!-- 中间区域 -->
                        <div id="centerContent">
                            <!-- 主编辑区 -->
                            <section id="editorArea">
                                <!-- 串口终端视图 -->
                                <div id="serial-terminal" class="terminal-view">
                                    <div class="terminal-toolbar">
                                        <span class="terminal-title">Serial Monitor</span>
                                        <div class="terminal-actions">
                                            <label class="hex-toggle">
                                                <input type="checkbox" id="hex-display-toggle" />
                                                <span>HEX</span>
                                            </label>
                                            <button id="clear-terminal-btn" class="terminal-btn" title="Clear">
                                                <svg viewBox="0 0 16 16" width="14" height="14">
                                                    <path fill="currentColor" d="M8.293 1.293a1 1 0 0 1 1.414 0l5.657 5.657a1 1 0 0 1 0 1.414l-5.657 5.657a1 1 0 0 1-1.414-1.414L12.586 8 8.293 3.707a1 1 0 0 1 0-1.414zM7 14H2V2h5v2h3l-1 1H7v9z"/>
                                                </svg>
                                            </button>
                                        </div>
                                    </div>
                                    <div id="terminal-output" class="terminal-output"></div>
                                </div>
                            </section>
                            <!-- 底部面板 -->
                            <aside id="panel" class="panel">
                                <!-- 上边缘拖动区域 -->
                                <div class="panel-resizer"></div>
                                <div class="panel-tabs">
                                    <span class="panel-tab active">Terminal</span>
                                    <span class="panel-tab">Problems</span>
                                    <span class="panel-tab">Output</span>
                                </div>
                                <div class="panel-content">
                                    <div class="terminal-placeholder">Terminal</div>
                                </div>
                            </aside>
                        </div>
                        <!-- 右侧边栏 -->
                        <aside id="auxBar" class="panel">
                            <div class="panel-header">Outline</div>
                            <div class="panel-content"></div>
                        </aside>
                    </div>
                </div>
            </div>

            <!-- 底部状态栏 -->
            <footer id="statusBar">
                <div class="status-left">
                    <span class="status-item">
                        <svg viewBox="0 0 16 16" width="14" height="14">
                            <path fill="currentColor" d="M6.75 3.5a.75.75 0 0 0-.75.75v7.5a.75.75 0 0 0 1.5 0v-7.5a.75.75 0 0 0-.75-.75zm3.5 0a.75.75 0 0 0-.75.75v7.5a.75.75 0 0 0 1.5 0v-7.5a.75.75 0 0 0-.75-.75z"/>
                            <path fill="currentColor" d="M1 4h14v1H1z"/>
                        </svg>
                        main
                    </span>
                    <span class="status-item">
                        <svg viewBox="0 0 16 16" width="14" height="14">
                            <path fill="currentColor" d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5v-9zM3.5 3a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-9z"/>
                        </svg>
                        Serial Monitor
                    </span>
                </div>
                <div class="status-right">
                    <span class="status-item">UTF-8</span>
                    <span class="status-item">LF</span>
                    <span class="status-item">Line 1, Col 1</span>
                    <span class="status-item notifications">
                        <svg viewBox="0 0 16 16" width="14" height="14">
                            <path fill="currentColor" d="M8 1a6 6 0 1 0 0 12A6 6 0 0 0 8 1zm0 11.5a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
                        </svg>
                    </span>
                    <span class="status-item notifications">
                        <svg viewBox="0 0 16 16" width="14" height="14">
                            <path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 13a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm1-3.5a1 1 0 0 1-2 0V7a1 1 0 0 1 2 0v4z"/>
                        </svg>
                        0
                    </span>
                </div>
            </footer>
        </div>

        <script src="scripts/renderer.js"></script>
    </body>
</html>
